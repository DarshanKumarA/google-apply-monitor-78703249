<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Careers Tracker</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1014;color:#f8fafc;font:16px Inter,system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #283244;padding-bottom:20px}.brand{font-weight:800;font-size:22px}.brand span{color:#9671ff}.nav a{color:#b8c3d5;text-decoration:none;margin-left:22px}.nav a:hover{color:#fff}.hero{text-align:center;padding:64px 10px 45px}.hero h1{font-size:43px;line-height:1.1;margin:0 0 13px}.hero p{color:#9aaac2;margin:0}.chooser,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.choice,.job{background:#191d24;border:1px solid #2b384d;border-radius:13px;padding:25px}.choice{min-height:210px;display:flex;flex-direction:column}.choice h2,.job h2{font-size:21px;margin:0 0 12px}.choice p,.meta{color:#aab7ca;line-height:1.65}.choice a,.apply{margin-top:auto;display:inline-block;width:max-content;background:#6d4ce8;border-radius:8px;padding:10px 14px;color:#fff;text-decoration:none;font-weight:700}.choice.archive a{background:#263447}.section{margin:10px 0 26px}.section h2{margin:0;font-size:28px}.section p{color:#9aaac2}.back{display:inline-block;color:#bcaaff;text-decoration:none;margin-bottom:25px}.job h2{font-size:19px}.apply{margin-top:18px;background:#2563eb}.empty{color:#aab7ca;background:#191d24;border:1px dashed #394962;border-radius:12px;padding:30px}.log{margin:48px 0 0;color:#9aaac2;font-size:13px}.log ul{padding-left:20px}.log li{margin:7px 0}@media(max-width:600px){.wrap{padding:18px}.nav a{margin-left:13px;font-size:14px}.hero{padding:45px 4px 35px}.hero h1{font-size:32px}}
</style></head><body><main class="wrap"><nav class="nav"><div class="brand">Google Careers <span>Tracker</span></div><div><a href="./">Apply monitor</a><a href="jobs.html">Home</a></div></nav><section class="hero"><h1>Early-career opportunities</h1><p>Google roles matching software engineering, internships, apprenticeships, graduate and fresher searches.</p></section><div id="content">Loading openings…</div><section class="log"><strong>Recent five-minute scans</strong><ul id="log"></ul></section></main><script>
const selected=new URLSearchParams(location.search).get('folder');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function jobsGrid(jobs,empty){return jobs.length?`<div class="grid">${jobs.map(j=>`<article class="job"><h2>${esc(j.title)}</h2><div class="meta">${esc(j.location)}<br>${esc(j.experience)}<br>First found: ${new Date(j.firstDetectedAt).toISOString()}<br>Posting date: ${esc(j.postingDate)}<br>Expiry: ${esc(j.expiryDate)}</div><a class="apply" href="${esc(j.jobUrl)}" target="_blank" rel="noreferrer">View & apply ↗</a></article>`).join('')}</div>`:`<div class="empty">${empty}</div>`}
fetch('jobs.json?t='+Date.now()).then(r=>r.json()).then(data=>{let view;if(selected==='new'||selected==='baseline'){const isNew=selected==='new',jobs=isNew?data.newOpenings:data.initial;view=`<a class="back" href="jobs.html">← Back to folders</a><section class="section"><h2>${isNew?'New openings folder':'Initial search archive'}</h2><p>${isNew?'Only roles discovered after the first scan appear here.':'The separate one-time starting snapshot; it is never mixed with new openings.'}</p></section>${jobsGrid(jobs,isNew?'No new openings since the initial scan.':'The initial archive is still loading.')}`}else{view=`<section class="chooser"><article class="choice"><h2>✨ New openings folder</h2><p><strong>${data.newOpenings.length}</strong> role(s) found after the baseline scan. This stays clean and only receives first-seen opportunities.</p><a href="?folder=new">Open new openings →</a></article><article class="choice archive"><h2>🗂 Initial search archive</h2><p><strong>${data.initial.length}</strong> role(s) saved from the first scan on ${new Date(data.baselineCreatedAt).toISOString()}.</p><a href="?folder=baseline">Open initial archive →</a></article></section>`}document.getElementById('content').innerHTML=view;document.getElementById('log').innerHTML=(data.checks||[]).slice(-10).reverse().map(x=>`<li>${new Date(x.checkedAt).toISOString()} — ${esc(x.result)}</li>`).join('');}).catch(()=>document.getElementById('content').textContent='Tracker data is temporarily unavailable.');
</script></body></html>
