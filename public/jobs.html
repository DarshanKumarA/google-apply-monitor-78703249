<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Careers early openings</title><style>
body{margin:0;background:#0f1115;color:#f7f8fb;font:16px system-ui,sans-serif}.wrap{max-width:1220px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.status{color:#9fb1cc}h1{font-size:42px;text-align:center;margin:72px 0 8px}p.sub{text-align:center;color:#a9b6ca;margin:0 0 42px}.tabs{display:flex;gap:10px;margin-bottom:24px}.tab{border:1px solid #33415a;background:#1a1f29;color:#b8c3d5;padding:11px 16px;border-radius:9px;text-decoration:none}.tab.active{background:#6e47ff;color:#fff;border-color:#6e47ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{border:1px solid #29364a;background:#191c22;border-radius:12px;padding:21px}.card h2{font-size:19px;margin:0 0 14px}.meta{color:#a9b6ca;font-size:14px;line-height:1.6}.apply{display:inline-block;margin-top:18px;color:#fff;text-decoration:none;background:#2563eb;padding:9px 13px;border-radius:7px;font-weight:700}.empty{color:#a9b6ca;padding:28px;border:1px dashed #3b4860;border-radius:10px}.log{margin-top:46px;color:#a9b6ca;font-size:13px}.log li{margin:7px 0}@media(max-width:600px){h1{font-size:32px;margin-top:45px}.wrap{padding:20px}}
</style></head><body><main class="wrap"><nav class="nav"><span class="brand">Google Careers Tracker</span><a class="status" href="./">Apply monitor</a></nav><h1>Early-career opportunities</h1><p class="sub">Google Careers roles matching software engineering, internships, apprenticeships, graduate and fresher searches.</p><section class="tabs"><a id="new-tab" class="tab" href="?folder=new">New openings folder</a><a id="baseline-tab" class="tab" href="?folder=baseline">Initial search archive</a></section><div id="content" class="empty">Loading openings…</div><section class="log"><strong>Scan history</strong><ul id="log"></ul></section></main><script>
const folder=new URLSearchParams(location.search).get('folder')==='baseline'?'baseline':'new';document.getElementById(folder+'-tab').classList.add('active');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('jobs.json?t='+Date.now()).then(r=>r.json()).then(data=>{const jobs=folder==='baseline'?data.initial:data.newOpenings;document.getElementById('content').innerHTML=jobs.length?`<div class="grid">${jobs.map(j=>`<article class="card"><h2>${esc(j.title)}</h2><div class="meta">${esc(j.location)}<br>${esc(j.experience)}<br>First found: ${new Date(j.firstDetectedAt).toISOString()}<br>Posting date: ${esc(j.postingDate)}<br>Expiry: ${esc(j.expiryDate)}</div><a class="apply" href="${esc(j.jobUrl)}" target="_blank" rel="noreferrer">View & apply ↗</a></article>`).join('')}</div>`:`<div class="empty">${folder==='new'?'No new openings since the initial scan. New roles will appear here automatically.':'The initial scan has not finished yet.'}</div>`;document.getElementById('log').innerHTML=(data.checks||[]).slice(-10).reverse().map(x=>`<li>${new Date(x.checkedAt).toISOString()} — ${esc(x.result)}</li>`).join('');}).catch(()=>document.getElementById('content').textContent='The tracker data is temporarily unavailable.');
</script></body></html>
